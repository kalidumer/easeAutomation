
name: Ease Online Academy Outreach

on:
  schedule:
  - cron: "0 5,10,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ease-online-campaign
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run campaign
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python campaign.py

      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campaign.db
          git diff --cached --quiet || (
            git commit -m "Update campaign history" &&
            git push
          )
